name: Stock VPS OVH

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      plan_code:
        description: planCode OVH (vide = les modèles surveillés)
        required: false
      datacenters:
        description: Codes de datacenters séparés par des espaces (vide = France)
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: watch

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      # Une panne sur un modèle n'interrompt pas la surveillance des autres.
      fail-fast: false
      matrix:
        # Modèles surveillés ; un lancement manuel avec plan_code n'en vérifie qu'un.
        plan_code: ${{ fromJSON(inputs.plan_code && format('["{0}"]', inputs.plan_code) || '["vps-2027-model1", "vps-2027-model2"]') }}
    steps:
      - uses: actions/checkout@v5
      - run: ./watch.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTIFY_USER: ${{ github.repository_owner }}
          PLAN_CODE: ${{ matrix.plan_code }}
          # Vide au déclenchement planifié : watch.sh retombe sur la France.
          DATACENTERS: ${{ inputs.datacenters }}
